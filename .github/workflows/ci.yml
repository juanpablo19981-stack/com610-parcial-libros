name: CI - pruebas automatizadas

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Instalar dependencias y ejecutar Jest
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Installar dependencias
        run: npm install
      - name: Ejecutar pruebas
        run: npm test
